name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Set app version from release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $config.version = $env:RELEASE_TAG -replace '^v', ''
          $config | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Video Press ${{ github.ref_name }}
          releaseBody: "AssetsからWindows用インストーラーをダウンロードしてください。"
          releaseDraft: false
          prerelease: false
